[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "remember-me"
version = "0.1.0"
description = "remember-me: decision gate for agent memory — local recall, then TypeSafe Jev hydrate/admit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Leon" }]
keywords = ["memory", "remember-me", "agent", "topology", "graph", "jev", "typesafe", "hydrate", "gate"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
remember-me = "remember_me.cli:main"

[project.urls]
Homepage = "https://github.com/leon/remember-me"
Documentation = "https://github.com/leon/remember-me#readme"
Issues = "https://github.com/leon/remember-me/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/remember_me"]

[tool.hatch.build.targets.sdist]
include = ["src/remember_me", "tests", "fixtures", "assets", "README.md", "LICENSE", "ARCHITECTURE.md", "SECURITY.md", "SCORECARD.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["remember_me"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
