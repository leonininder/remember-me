name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest (offline)
        run: pytest -q --cov=remember_me --cov-report=term-missing
        env:
          # Ensure no accidental cloud calls in CI
          TYPESAFE_API_KEY: ""
      - name: Bake-off offline
        run: remember-me bakeoff --out bakeoff_metrics.json
      - name: Upload bake-off metrics
        uses: actions/upload-artifact@v4
        with:
          name: bakeoff-metrics-py${{ matrix.python-version }}
          path: bakeoff_metrics.json
