name: TFL

on:
  push:
    branches: [main, master]
    paths:
      - "src/remember_me/tfl/**"
      - "fixtures/memorybench_tfl/**"
      - "tests/tfl/**"
      - ".github/workflows/tfl.yml"
      - "docs/plans/TEMPORAL_FACT_LEDGER_PLAN.md"
  pull_request:
    branches: [main, master]
    paths:
      - "src/remember_me/tfl/**"
      - "fixtures/memorybench_tfl/**"
      - "tests/tfl/**"
      - ".github/workflows/tfl.yml"
      - "docs/plans/TEMPORAL_FACT_LEDGER_PLAN.md"
  workflow_dispatch:

jobs:
  tfl-ledger-props:
    name: tfl-ledger-props
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (tfl)
        run: ruff check src/remember_me/tfl tests/tfl
      - name: TFL ledger property tests
        run: pytest -q tests/tfl/test_ledger_props.py tests/tfl/test_ontology_mint.py tests/tfl/test_validate.py tests/tfl/test_quarantine.py

  tfl-reconcile-unit:
    name: tfl-reconcile-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (tfl reconcile)
        run: ruff check src/remember_me/tfl tests/tfl
      - name: TFL reconcile unit + chaos + redact (FakeJev)
        run: >
          pytest -q
          tests/tfl/test_reconcile_policy.py
          tests/tfl/test_reconcile_fake.py
          tests/tfl/test_reconcile_chaos.py
          tests/tfl/test_reconcile_redact.py
          tests/tfl/test_quarantine.py

  # Phase D commitment
  tfl-memorybench:
    name: tfl-memorybench
    runs-on: ubuntu-latest
    if: false  # enabled when Phase D harness lands
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: echo "Phase D — tfl-memorybench not yet enabled"
