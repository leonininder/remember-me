name: TFL

on:
  push:
    branches: [main, master]
    paths:
      - "src/remember_me/tfl/**"
      - "fixtures/memorybench_tfl/**"
      - "tests/tfl/**"
      - ".github/workflows/tfl.yml"
      - "docs/plans/TEMPORAL_FACT_LEDGER_PLAN.md"
  pull_request:
    branches: [main, master]
    paths:
      - "src/remember_me/tfl/**"
      - "fixtures/memorybench_tfl/**"
      - "tests/tfl/**"
      - ".github/workflows/tfl.yml"
      - "docs/plans/TEMPORAL_FACT_LEDGER_PLAN.md"
  workflow_dispatch:

jobs:
  tfl-ledger-props:
    name: tfl-ledger-props
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff (tfl)
        run: ruff check src/remember_me/tfl tests/tfl
      - name: TFL ledger property tests
        run: pytest -q tests/tfl

  # Phase C commitment (stub job — real FakeJev reconcile + chaos lands in Phase C)
  tfl-reconcile-unit:
    name: tfl-reconcile-unit
    runs-on: ubuntu-latest
    if: false  # enabled when Phase C code lands
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: echo "Phase C — tfl-reconcile-unit not yet enabled"

  # Phase D commitment
  tfl-memorybench:
    name: tfl-memorybench
    runs-on: ubuntu-latest
    if: false  # enabled when Phase D harness lands
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: echo "Phase D — tfl-memorybench not yet enabled"
